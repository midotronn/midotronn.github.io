<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="academic-nav" aria-label="Primary navigation">
      <a class="academic-site-title" href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>{{ site.title }}</a>
      <button type="button" class="academic-menu-toggle" aria-expanded="false" aria-controls="academic-navigation" aria-label="Toggle navigation">
        <span class="academic-menu-icon" aria-hidden="true"></span>
      </button>
      <ul class="academic-nav-links" id="academic-navigation">
        {% for link in site.data.navigation.main %}
        <li><a href="{{ link.url | relative_url }}"{% if page.section == link.id %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</div>
