headline: Efficient models. Meaningful human control.
intro: >-
  I am a master's student in Computer Science at The University of Texas at Austin.
  I study efficient multimodal and embodied AI, with an interest in systems that
  are both computationally practical and responsive to the people using them.
research_intro: >-
  My work connects two questions: how can we make intelligent systems more
  efficient and reliable, and how can people guide what those systems do?
interests:
  - title: Efficient embodied AI
    description: Reducing unnecessary computation in vision-language-action models while retaining task-relevant information.
  - title: Controllable generation
    description: Building agentic workflows that let people plan, revise and recover complex multimodal outputs.
  - title: Robust interaction
    description: Understanding how models and systems respond to changing environments, instructions and user feedback.
